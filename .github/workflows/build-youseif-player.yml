name: Build Youseif Player APK

# Builds the Youseif Player Pro Android app (Kotlin / Jetpack Compose) into a
# signed APK and sends it to Telegram using the repo secrets BOT_TOKEN / ADMIN_ID.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform + build tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
          [ -n "$SDKMANAGER" ] || SDKMANAGER=$(command -v sdkmanager)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      # A release keystore is required to sign the APK. The repo does NOT ship
      # the keystore (it is not committed) — CI restores it from the secret
      # YOUSEIF_KEYSTORE_BASE64, or falls back to a throwaway key so the build
      # always produces an installable APK.
      - name: Resolve signing keystore
        env:
          KS_B64: ${{ secrets.YOUSEIF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/youseif-release.jks
            echo "Using the release keystore from repository secrets."
          else
            keytool -genkeypair -v -keystore app/youseif-release.jks \
              -alias youseif -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass youseif2025 -keypass youseif2025 \
              -dname "CN=Youseif Player Pro, O=Youseif, C=EG"
            echo "::warning::YOUSEIF_KEYSTORE_BASE64 is not set — generated a throwaway key. New APKs will not install over an older build."
          fi

      - name: Build release APK
        env:
          YOUSEIF_KEYSTORE_PATH: youseif-release.jks
          YOUSEIF_STORE_PASSWORD: ${{ secrets.YOUSEIF_STORE_PASSWORD || 'youseif2025' }}
          YOUSEIF_KEY_ALIAS: ${{ secrets.YOUSEIF_KEY_ALIAS || 'youseif' }}
          YOUSEIF_KEY_PASSWORD: ${{ secrets.YOUSEIF_KEY_PASSWORD || 'youseif2025' }}
          YOUSEIF_VERSION_CODE: ${{ github.run_number }}
          YOUSEIF_VERSION_NAME: "25.4.${{ github.run_number }}"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
          ls -lh app/build/outputs/apk/release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: youseif-player-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Send APK to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$ADMIN_ID" ]; then
            echo "Missing repository secrets BOT_TOKEN / ADMIN_ID — skipping Telegram."
            exit 0
          fi
          APK=$(ls app/build/outputs/apk/release/app-universal-release.apk 2>/dev/null || ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "Sending $APK"
          API="https://api.telegram.org/bot${BOT_TOKEN}"
          SIZE=$(du -h "$APK" | cut -f1)
          MSG="🎬 Youseif Player Pro — APK (${SIZE}) @ ${GITHUB_SHA::7}"
          for i in 1 2 3; do
            RESP=$(curl -sS --max-time 300 -X POST "${API}/sendDocument" \
              -F chat_id="${ADMIN_ID}" \
              -F caption="${MSG}" \
              -F document=@"$APK")
            echo "attempt ${i}: ${RESP:0:300}"
            if echo "$RESP" | grep -q '"ok":true'; then
              echo "TELEGRAM_SENT_OK"
              exit 0
            fi
            sleep 10
          done
          echo "TELEGRAM_SEND_FAILED — see response above"
          exit 1
