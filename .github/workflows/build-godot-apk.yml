name: Build Godot Android APK

# Builds Neon Rush Racing (Godot 4) into an installable, signed Android APK,
# runs the game's headless smoke test, and sends the APK to Telegram using the
# repo secrets BOT_TOKEN / ADMIN_ID.
on:
  workflow_dispatch:
  push:
    branches: [godot-port]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy original assets from the Unity project
        run: bash godot/setup_assets.sh

      - name: Set up Godot 4.4.1 headless
        run: |
          mkdir -p "$HOME/godot-bin"
          curl -sL -o "$HOME/godot-bin/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q "$HOME/godot-bin/godot.zip" -d "$HOME/godot-bin"
          mv "$HOME/godot-bin/Godot_v4.4.1-stable_linux.x86_64" "$HOME/godot-bin/godot"
          chmod +x "$HOME/godot-bin/godot"
          "$HOME/godot-bin/godot" --version

      - name: Install export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -sL -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          # The .tpz contains a nested "templates/" folder — flatten it.
          if [ -d "$HOME/.local/share/godot/export_templates/4.4.1.stable/templates" ]; then
            mv "$HOME/.local/share/godot/export_templates/4.4.1.stable/templates/"* \
               "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
            rmdir "$HOME/.local/share/godot/export_templates/4.4.1.stable/templates"
          fi
          ls "$HOME/.local/share/godot/export_templates/4.4.1.stable/" | head -n 20

      - name: Install Android build tools
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "build-tools;34.0.0" "platforms;android-34" > /dev/null
          ls "$ANDROID_HOME/build-tools/"

      - name: Import project resources
        run: '"$HOME/godot-bin/godot" --headless --import --path godot 2>&1 | tail -n 5'

      # Fails the build if the game has any runtime/script error instead of
      # shipping a broken APK. The test runner is added as an autoload only for
      # this step (the committed project.godot stays clean).
      - name: Smoke test (headless)
        run: |
          cp godot/project.godot /tmp/project.godot.bak
          python3 - <<'PY'
          p = "godot/project.godot"
          s = open(p).read()
          s = s.replace("[autoload]\n", '[autoload]\n\nTestRunner="*res://test_runner.gd"\n', 1)
          open(p, "w").write(s)
          PY
          set +e
          OUT=$("$HOME/godot-bin/godot" --headless --path godot --quit-after 2600 2>&1)
          RC=$?
          set -e
          # restore the original project.godot so the test autoload is never shipped
          cp /tmp/project.godot.bak godot/project.godot
          echo "$OUT" | tail -n 50
          if echo "$OUT" | grep -q "ALL_TESTS_PASSED"; then
            echo "SMOKE_TEST_OK"
          else
            echo "SMOKE_TEST_FAILED (exit $RC)"
            exit 1
          fi

      # Persistent signing key (so new APKs install OVER older ones).
      # If ANDROID_KEYSTORE_BASE64 is not set, fall back to a throwaway key.
      - name: Resolve signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.android"
          KS_PATH="$HOME/.android/neonrush.keystore"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS_PATH"
            ALIAS="${KS_ALIAS:-neonrush}"
            PASS="${KS_PASS:-neonrush123}"
            echo "Using the persistent release keystore from repository secrets."
          else
            keytool -keyalg RSA -genkeypair -alias neonrush -keysize 2048 -validity 10000 \
              -keystore "$KS_PATH" \
              -storepass neonrush123 -keypass neonrush123 \
              -dname "CN=Neon Rush Racing, O=NeonRush, C=EG"
            ALIAS="neonrush"
            PASS="neonrush123"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — generated a throwaway key. New APKs will NOT update in place over an older install."
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KS_PATH"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Export APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          # Bump versionCode/versionName from the CI run number so each release is
          # newer than the last (required for updating an installed APK).
          sed -i "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" godot/export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"1.0.${GITHUB_RUN_NUMBER}\"|" godot/export_presets.cfg
          grep -E "^version/" godot/export_presets.cfg
          cd godot
          "$HOME/godot-bin/godot" --headless --export-release "Android" ../NeonRushRacing.apk
          cd ..
          ls -lh NeonRushRacing.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonRushRacing-apk
          path: NeonRushRacing.apk
          retention-days: 30

      - name: Send APK to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$ADMIN_ID" ]; then
            echo "Missing repository secrets BOT_TOKEN / ADMIN_ID — skipping Telegram."
            exit 0
          fi
          API="https://api.telegram.org/bot${BOT_TOKEN}"
          SIZE=$(du -h NeonRushRacing.apk | cut -f1)
          MSG="🏁 Neon Rush Racing (Godot 4) — APK (${SIZE}) @ ${GITHUB_SHA::7}"
          for i in 1 2 3; do
            RESP=$(curl -sS --max-time 300 -X POST "${API}/sendDocument" \
              -F chat_id="${ADMIN_ID}" \
              -F caption="${MSG}" \
              -F document="@NeonRushRacing.apk")
            echo "attempt ${i}: ${RESP:0:300}"
            if echo "$RESP" | grep -q '"ok":true'; then
              echo "TELEGRAM_SENT_OK"
              exit 0
            fi
            sleep 10
          done
          echo "TELEGRAM_SEND_FAILED — see response above"
          exit 1
