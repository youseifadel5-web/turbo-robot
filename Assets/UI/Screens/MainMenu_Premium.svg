<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04060A"/>
      <stop offset="55%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#160818"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E8FF"/>
      <stop offset="100%" stop-color="#6A5CFF"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2BD6"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1920" height="1080" fill="none" stroke="#00F0FF" stroke-opacity="0.08" stroke-width="2"/>
  <text x="1480" y="92" text-anchor="end" fill="url(#logo)" font-size="42" font-family="Arial Black, Arial" font-weight="900" filter="url(#glow)">NEON RUSH</text>
  <text x="1480" y="128" text-anchor="end" fill="#9AA3B5" font-size="16" font-family="Arial" letter-spacing="8">RACING</text>
  <rect x="70" y="240" width="420" height="78" rx="16" fill="none" stroke="#00F0FF" stroke-width="2.5"/>
  <text x="280" y="290" text-anchor="middle" fill="#F2F5FF" font-size="28" font-family="Arial">PLAY</text>
  <rect x="70" y="340" width="420" height="78" rx="16" fill="none" stroke="#2A3348" stroke-width="2"/>
  <text x="280" y="390" text-anchor="middle" fill="#C5CDDA" font-size="26" font-family="Arial">GARAGE</text>
  <rect x="70" y="440" width="420" height="78" rx="16" fill="none" stroke="#2A3348" stroke-width="2"/>
  <text x="280" y="490" text-anchor="middle" fill="#C5CDDA" font-size="26" font-family="Arial">EVENTS</text>
  <rect x="70" y="540" width="420" height="78" rx="16" fill="none" stroke="#2A3348" stroke-width="2"/>
  <text x="280" y="590" text-anchor="middle" fill="#C5CDDA" font-size="26" font-family="Arial">SETTINGS</text>
  <text x="90" y="980" fill="#5B6578" font-size="16" font-family="Arial">LV 12   ·   3D CAR STAGE RIGHT   ·   OFFLINE</text>
  <ellipse cx="1280" cy="720" rx="380" ry="36" fill="#00F0FF" opacity="0.12"/>
  <text x="1280" y="560" text-anchor="middle" fill="#3A4558" font-size="18" font-family="Arial">3D HERO CAR  ·  WET REFLECTION</text>
