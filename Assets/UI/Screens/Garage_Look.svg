<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05070C"/>
      <stop offset="100%" stop-color="#0A1220"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#FF2BD6"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="80" y="90" fill="#F2F5FF" font-size="42" font-family="Arial" font-weight="700">GARAGE</text>
  <text x="80" y="128" fill="#00F0FF" font-size="18" font-family="Arial">NEON RUSH</text>
  <rect x="1520" y="50" width="320" height="56" rx="28" fill="#0C1018" stroke="#00F0FF" stroke-width="1.5"/>
  <text x="1560" y="86" fill="#FFC84D" font-size="22" font-family="Arial">●  1,586,636</text>
  <!-- car stage -->
  <ellipse cx="960" cy="640" rx="420" ry="48" fill="#00F0FF" opacity="0.12"/>
  <ellipse cx="960" cy="640" rx="360" ry="28" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.5"/>
  <text x="960" y="430" text-anchor="middle" fill="#F2F5FF" font-size="28" font-family="Arial">STORM R  ·  CLASS S</text>
  <!-- stats -->
  <g font-family="Arial" fill="#9AA3B5" font-size="16">
    <text x="80" y="220">TOP SPEED</text>
    <rect x="80" y="230" width="260" height="10" rx="5" fill="#1A2230"/>
    <rect x="80" y="230" width="210" height="10" rx="5" fill="#00F0FF"/>
    <text x="80" y="280">ACCELERATION</text>
    <rect x="80" y="290" width="260" height="10" rx="5" fill="#1A2230"/>
    <rect x="80" y="290" width="190" height="10" rx="5" fill="#00F0FF"/>
    <text x="80" y="340">HANDLING</text>
    <rect x="80" y="350" width="260" height="10" rx="5" fill="#1A2230"/>
    <rect x="80" y="350" width="175" height="10" rx="5" fill="#FF2BD6"/>
    <text x="80" y="400">NITRO</text>
    <rect x="80" y="410" width="260" height="10" rx="5" fill="#1A2230"/>
    <rect x="80" y="410" width="200" height="10" rx="5" fill="#FF2BD6"/>
  </g>
  <!-- carousel -->
  <rect x="280" y="860" width="1360" height="140" rx="20" fill="#0C1018CC" stroke="#1E2A3C"/>
  <text x="360" y="940" fill="#8C97A8" font-size="18" font-family="Arial">FALCON S</text>
  <text x="620" y="940" fill="#8C97A8" font-size="18" font-family="Arial">RAZOR GT</text>
  <text x="900" y="940" fill="#00F0FF" font-size="18" font-family="Arial">STORM R</text>
  <text x="1160" y="940" fill="#8C97A8" font-size="18" font-family="Arial">VIPER X</text>
  <text x="1420" y="940" fill="#8C97A8" font-size="18" font-family="Arial">TORNADO</text>
  <rect x="1540" y="760" width="280" height="72" rx="16" fill="#00F0FF"/>
  <text x="1680" y="806" text-anchor="middle" fill="#05070C" font-size="28" font-family="Arial" font-weight="700">RACE</text>
  <rect x="1240" y="760" width="280" height="72" rx="16" fill="#111722" stroke="#FF2BD6"/>
  <text x="1380" y="806" text-anchor="middle" fill="#F2F5FF" font-size="24" font-family="Arial">CUSTOMIZE</text>
</svg>
